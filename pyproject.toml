[project]
name = "concam-pipeline"
version = "0.1.0"
description = "MIT Green Building sky camera contrail detection and labeling pipeline"
requires-python = ">=3.12"
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "duckdb>=0.10",
    "scipy>=1.10",
    "feder>=0.2.4",
    "pyproj>=3.7.2",
    "pytz>=2026.1.post1",
    "av>=17.0.0",
]

[project.optional-dependencies]
ocr = ["easyocr>=1.7"]
dev = ["pytest>=8.0", "hypothesis>=6.0"]

[project.scripts]
concam = "concam.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["concam"]

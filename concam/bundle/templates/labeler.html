<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ConCam Labeler</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; margin: 0; color: #222; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  header { display: flex; gap: 1.5rem; align-items: baseline; padding: 0.4rem 0.75rem; background: #f8f8f8; border-bottom: 1px solid #ddd; flex-shrink: 0; flex-wrap: wrap; }
  header h1 { font-size: 1.1rem; margin: 0; }
  .hdr-pill { font-size: 0.85em; padding: 0.1em 0.5em; border-radius: 999px; background: #eee; color: #333; }
  .hdr-user { background: #1f2937; color: #fff; font-weight: 600; }
  .hdr-score { background: #dcfce7; color: #166534; font-weight: 600; }
  #toolbar { display: flex; gap: 0.75rem; padding: 0.3rem 0.75rem; align-items: center; flex-wrap: wrap; background: #f0f0f0; border-bottom: 1px solid #ddd; flex-shrink: 0; }
  #toolbar label { user-select: none; cursor: pointer; font-size: 0.9em; }
  #main { display: flex; flex: 1; min-height: 0; }
  #video-col { flex: 1 1 0; min-width: 0; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 0.5rem; }
  #video-wrap { position: relative; line-height: 0; max-width: 100%; max-height: 100%; aspect-ratio: var(--video-aspect, 16/9); }
  #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
  video { width: 100%; height: 100%; background: #000; display: block; }
  #sidebar { width: 420px; flex-shrink: 0; display: flex; flex-direction: column; border-left: 1px solid #ccc; }
  #sidebar-header { padding: 0.4rem 0.5rem; background: #f8f8f8; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
  #sidebar-header span { font-size: 0.85em; color: #555; }
  #episodes { flex: 1; overflow-y: auto; padding: 0.25rem; }
  .episode { padding: 0.4rem 0.5rem; border-bottom: 1px solid #eee; }
  .episode.labeled { background: #f0fdf4; }
  .episode-header { display: flex; gap: 0.4rem; align-items: center; flex-wrap: wrap; cursor: pointer; font-size: 0.88em; }
  .episode-header:hover { background: #f5f5f5; }
  .episode .badge { display: inline-block; padding: 0 0.35em; border-radius: 3px; font-size: 0.78em; }
  .episode .badge.overlap { background: #fffa8a; }
  .episode .badge.score { background: #cce5ff; }
  .episode .badge.detected { background: #c8f7c5; }
  .episode .badge.label-status { background: #e5e7eb; }
  .episode .badge.label-status.contrail { background: #86efac; }
  .episode .badge.label-status.no_contrail { background: #fca5a5; }
  .episode .badge.label-status.unsure { background: #fde68a; }
  .label-controls { display: flex; gap: 0.5rem; margin-top: 0.3rem; align-items: center; flex-wrap: wrap; font-size: 0.85em; }
  .label-controls .group { display: flex; gap: 0.2rem; align-items: center; }
  .label-controls input[type="radio"] { margin: 0 0.1rem 0 0.3rem; }
  .label-controls input[type="range"] { vertical-align: middle; width: 70px; }
  .label-controls textarea { flex: 1 1 100%; min-height: 1.6em; font-family: inherit; font-size: 0.85em; padding: 0.15rem; }
  .error { color: #b00; background: #fee; padding: 0.5rem 0.75rem; border: 1px solid #f99; border-radius: 4px; margin: 0.5rem; }
  .legend { font-size: 0.8em; color: #555; }
  .swatch { display: inline-block; width: 10px; height: 10px; vertical-align: middle; margin-right: 3px; border-radius: 2px; }
  #progress { font-size: 0.85em; color: #555; }
  #export-btn { padding: 0.25rem 0.6rem; font-size: 0.85em; cursor: pointer; }
  .seek-btn { padding: 0 0.4em; font-size: 0.85em; cursor: pointer; }
  .ep-times { white-space: nowrap; }
  .ep-time-local { color: #666; font-size: 0.92em; }
  .episode.flash { animation: ep-flash 1.2s ease-out; }
  @keyframes ep-flash {
    0%   { background: #fde68a; }
    100% { background: transparent; }
  }
  #video-wrap.clickable { cursor: pointer; }
  /* Heatmap panel: time × flight-level summary of contrail-forming regions. */
  #heatmap-panel { position: relative; padding: 0.4rem 0.5rem; border-bottom: 1px solid #ddd; background: #fafafa; flex-shrink: 0; overflow-x: auto; }
  #heatmap-panel h2 { font-size: 0.85em; margin: 0 0 0.25rem; font-weight: 600; color: #333; display: flex; align-items: baseline; gap: 0.5rem; }
  #heatmap-panel h2 .subtitle { font-weight: 400; color: #777; font-size: 0.95em; }
  #heatmap-svg { display: block; user-select: none; }
  #heatmap-svg .hm-cell { cursor: default; }
  #heatmap-svg .hm-cell:hover { stroke: #000; stroke-width: 0.5; }
  #heatmap-svg .hm-axis { font: 9px system-ui, sans-serif; fill: #666; }
  #heatmap-svg .hm-frame { fill: none; stroke: #bbb; stroke-width: 0.5; }
  #heatmap-tooltip { position: absolute; pointer-events: none; background: rgba(20,20,20,0.92); color: #fff; padding: 0.35rem 0.5rem; border-radius: 4px; font-size: 0.78em; line-height: 1.35; white-space: nowrap; max-width: 280px; z-index: 100; display: none; }
  #heatmap-tooltip strong { color: #fde68a; }
  #heatmap-tooltip .hm-flight { white-space: nowrap; }
  #heatmap-tooltip .hm-flight.contrail::before { content: "■ "; color: #ef4444; }
  #heatmap-tooltip .hm-flight.clear::before { content: "■ "; color: #3b82f6; }
  #heatmap-controls { margin-top: 0.3rem; display: flex; gap: 0.4rem; align-items: center; font-size: 0.78em; color: #555; }
  #heatmap-controls button { padding: 0.1rem 0.5rem; font-size: 0.85em; cursor: pointer; }
  #heatmap-legend { display: inline-flex; gap: 0.4rem; align-items: center; }
  #heatmap-legend .swatch { display: inline-block; width: 9px; height: 9px; border-radius: 1px; vertical-align: -1px; }
</style>
</head>
<body>

<header>
  <h1>ConCam Labeler</h1>
  <label id="hdr-date-switcher" hidden>date:
    <select id="hdr-date-select"></select>
  </label>
  <span id="hdr-date"></span>
  <span id="hdr-episode-count"></span>
  <span id="hdr-spacer" style="flex:1"></span>
  <span id="hdr-score" class="hdr-pill hdr-score" title="Contrails you've confirmed in this session"></span>
  <span id="hdr-user" class="hdr-pill hdr-user"></span>
</header>

<div id="toolbar">
  <label><input type="checkbox" id="toggle-tracks" checked> ADS-B</label>
  <label style="margin-left:0.25rem"><input type="radio" name="track-mode" id="track-mode-dot" value="dot" checked> dot only</label>
  <label style="margin-left:0.25rem"><input type="radio" name="track-mode" id="track-mode-track" value="track"> + track</label>
  <label style="margin-left:1rem">shape:</label>
  <label style="margin-left:0.25rem"><input type="radio" name="dot-style" id="dot-style-filled" value="filled" checked> filled</label>
  <label style="margin-left:0.25rem"><input type="radio" name="dot-style" id="dot-style-ring" value="ring"> ring</label>
  <label style="margin-left:1rem"><input type="checkbox" id="toggle-detections"> Detection lines</label>
  <label style="margin-left:1rem"><input type="checkbox" id="toggle-zoom"> Zoom box</label>
  <label style="margin-left:1rem">Sort:
    <select id="sort-mode">
      <option value="time">time</option>
      <option value="score">score (desc)</option>
    </select>
  </label>
  <label style="margin-left:0.5rem"><input type="checkbox" id="filter-detected"> detected only</label>
  <span class="legend">
    <span class="swatch" style="background:#a855f7"></span>contrail coming
    <span class="swatch" style="background:#f5c542; margin-left:0.5rem"></span>contrail forming now
    <span class="swatch" style="background:#5aa0ff; margin-left:0.5rem"></span>other flight
    <span class="swatch" style="background:#ff3b3b; margin-left:0.5rem"></span>detection line
  </span>
</div>

<div id="error-panel" class="error" hidden></div>

<div id="main">
  <div id="video-col">
    <div id="video-wrap">
      <video id="video" controls muted></video>
      <canvas id="overlay"></canvas>
    </div>
  </div>
  <div id="sidebar">
    <div id="sidebar-header">
      <span id="progress">loading…</span>
      <button id="export-btn" type="button">Export labels</button>
    </div>
    <section id="heatmap-panel" hidden>
      <h2>Flight levels &times; time <span class="subtitle">(UTC)</span></h2>
      <svg id="heatmap-svg" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="heatmap-tooltip"></div>
      <div id="heatmap-controls">
        <span id="heatmap-legend">
          <span class="swatch" style="background:#ef4444"></span>contrail
          <span class="swatch" style="background:#3b82f6; margin-left:0.3rem"></span>clear
          <span class="swatch" style="background:#888; margin-left:0.3rem"></span>mixed
        </span>
        <span style="flex:1"></span>
        <button id="heatmap-svg-btn" type="button" title="Download as SVG">SVG</button>
        <button id="heatmap-png-btn" type="button" title="Download as PNG">PNG</button>
      </div>
    </section>
    <section id="episodes">
      <em>Loading manifest…</em>
    </section>
  </div>
</div>

<script>
// Browser-based labeler — video playback + canvas overlays.
//
// Time mapping:
//   frame_index   = Math.round(currentTime_s * video_fps)
//   wall_time_ms  = video_start_ms + frame_index * seconds_per_frame * 1000
//
// video_fps is the *encoded* playback frame-rate (e.g. 30 for the MIT timelapse).
// seconds_per_frame is real-world seconds between consecutive frames (1.0 for
// 1fps capture, 0.25 for 4fps raw segments).
// Together they map video playhead time → real wall time correctly regardless
// of how the video was compressed.
(async function () {
  const errPanel = document.getElementById("error-panel");
  const showError = (msg) => {
    errPanel.textContent = msg;
    errPanel.hidden = false;
  };

  let manifest;
  try {
    const res = await fetch("manifest.json");
    if (!res.ok) throw new Error("manifest.json HTTP " + res.status);
    manifest = await res.json();
  } catch (e) {
    showError("Failed to load manifest.json: " + e.message);
    return;
  }

  document.getElementById("hdr-date").textContent = "date: " + manifest.date;
  document.getElementById("hdr-episode-count").textContent =
    "episodes: " + manifest.episodes.length;

  // --- Reviewer identity -------------------------------------------------
  // Preference order: ?user= query (set by Prash when distributing links),
  // then localStorage, then a prompt. We can't read BasicAuth's username
  // from JS, so identity is declared client-side; the server endpoint
  // (if enabled) authoritatively verifies against REMOTE_USER.
  function resolveReviewer() {
    const urlUser = new URL(location.href).searchParams.get("user");
    if (urlUser) {
      localStorage.setItem("concam-reviewer", urlUser);
      return urlUser;
    }
    const stored = localStorage.getItem("concam-reviewer");
    if (stored) return stored;
    const entered = (prompt("Reviewer username (same as your login):") || "").trim();
    if (entered) localStorage.setItem("concam-reviewer", entered);
    return entered || "anonymous";
  }
  const reviewerId = resolveReviewer();
  manifest.labeler_id = reviewerId;
  document.getElementById("hdr-user").textContent = reviewerId;

  // --- Date switcher ------------------------------------------------------
  // If the parent directory has dates.json (written by the publish script),
  // show a dropdown so reviewers can hop between dates without going back
  // to the landing page. The query string (notably ?user=) is preserved so
  // the reviewer's identity carries over.
  (async function setupDateSwitcher() {
    try {
      const res = await fetch("../dates.json", { cache: "no-cache" });
      if (!res.ok) return;
      const payload = await res.json();
      const entries = Array.isArray(payload.dates) ? payload.dates : [];
      if (entries.length <= 1) return;
      const switcher = document.getElementById("hdr-date-switcher");
      const select = document.getElementById("hdr-date-select");
      for (const entry of entries) {
        const opt = document.createElement("option");
        opt.value = entry.date;
        opt.textContent = entry.date +
          " (" + entry.episodes + " passes, " + entry.detected + " detected)";
        if (entry.date === manifest.date) opt.selected = true;
        select.appendChild(opt);
      }
      switcher.hidden = false;
      // Hide the static date span — the dropdown already shows the current date.
      document.getElementById("hdr-date").hidden = true;
      select.addEventListener("change", () => {
        const target = select.value;
        if (!target || target === manifest.date) return;
        const query = new URL(location.href).search;
        location.href = "../" + target + "/labeler.html" + query;
      });
    } catch (_) {
      // No dates.json — single-date deployment. Silent no-op.
    }
  })();

  // --- Time mapping -------------------------------------------------------
  const videoStartMs = manifest.video.start_utc
    ? Date.parse(manifest.video.start_utc)
    : Date.parse(manifest.date + "T00:00:00Z");
  const secondsPerFrame = manifest.video.seconds_per_frame || 1.0;
  const videoFps = manifest.video.fps || 30.0;
  const detectionThreshold =
    typeof manifest.detection_threshold === "number"
      ? manifest.detection_threshold
      : 0.3;

  // currentTime_s × videoFps → frame index; frame index × secondsPerFrame → real elapsed seconds.
  const currentWallMs = (videoTime) =>
    videoStartMs + Math.round(videoTime * videoFps) * secondsPerFrame * 1000;
  const wallMsToVideoTime = (wallMs) =>
    ((wallMs - videoStartMs) / 1000 / secondsPerFrame) / videoFps;

  // --- Time formatting ---------------------------------------------------
  // The header already shows the bundle date, so per-episode rows only need
  // time-of-day. We render both UTC (authoritative, matches manifest) and
  // the reviewer's browser-local time (useful for students who think in
  // wall-clock terms, e.g. "8am over Boston"). Full ISO onset/end stay
  // accessible via the row's `title` tooltip.
  const localTzAbbr = (() => {
    try {
      const parts = new Intl.DateTimeFormat(undefined, { timeZoneName: "short" })
        .formatToParts(new Date());
      const tz = parts.find((p) => p.type === "timeZoneName");
      return tz ? tz.value : "local";
    } catch (_) {
      return "local";
    }
  })();
  function fmtTimeUTC(iso) {
    return new Date(iso).toISOString().substring(11, 19);
  }
  function fmtTimeLocal(iso) {
    return new Date(iso).toLocaleTimeString([], {
      hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false,
    });
  }

  // --- Flight track indexing ---------------------------------------------
  // Each track.pings is already time-sorted. We pre-parse wall_time_utc once.
  const flightTracks = Object.entries(manifest.flight_tracks || {}).map(
    ([tid, track]) => ({
      tid,
      callsign: track.callsign,
      pings: track.pings.map((p) => ({
        t: Date.parse(p.wall_time_utc),
        x: p.pixel_x,
        y: p.pixel_y,
        // Barometric (pressure) altitude in metres — canonical source for
        // flight level display. Falls back to effective alt_m if missing.
        alt_baro_m: p.alt_baro_m != null ? p.alt_baro_m : (p.alt_m != null ? p.alt_m : null),
      })),
    })
  );

  function flightLevel(altMetres) {
    if (altMetres == null || !isFinite(altMetres)) return null;
    const fl = Math.round((altMetres * 3.28084) / 100);
    return "FL" + String(fl).padStart(3, "0");
  }

  // Episodes grouped by transponder_id for fast "is this flight auto-detected now?" lookup.
  const episodesByTid = new Map();
  manifest.episodes.forEach((ep) => {
    const list = episodesByTid.get(ep.transponder_id) || [];
    list.push({
      episode_id: ep.episode_id,
      onset: Date.parse(ep.onset),
      end: Date.parse(ep.end),
      peak_score: ep.peak_score,
      frames: (ep.frames || []).map((f) => ({
        t: Date.parse(f.wall_time_utc),
        score: f.score,
        line: f.pixel_line,
      })),
    });
    episodesByTid.set(ep.transponder_id, list);
  });

  const TRACK_WINDOW_MS = 60_000; // ±60s of track around current time
  const FRAME_MATCH_MS = Math.max(500, secondsPerFrame * 1000);

  // --- Canvas sizing ------------------------------------------------------
  const video = document.getElementById("video");
  const canvas = document.getElementById("overlay");
  const ctx = canvas.getContext("2d");
  const [imgW, imgH] = manifest.image_size;
  document.documentElement.style.setProperty("--video-aspect", imgW + "/" + imgH);

  function fitCanvas() {
    // Back the canvas with the full image pixel resolution so drawing ops
    // happen in pixel-space coordinates; scale via CSS to match the rendered
    // video element. This preserves overlay precision on high-dpi displays
    // without us having to apply a scale factor in every draw call.
    const rect = video.getBoundingClientRect();
    canvas.width = imgW;
    canvas.height = imgH;
    canvas.style.width = rect.width + "px";
    canvas.style.height = rect.height + "px";
  }
  video.addEventListener("loadedmetadata", fitCanvas);
  window.addEventListener("resize", fitCanvas);

  // --- Drawing -----------------------------------------------------------
  const toggleTracks = document.getElementById("toggle-tracks");
  const toggleDetections = document.getElementById("toggle-detections");
  const trackModeDot = document.getElementById("track-mode-dot");
  const trackModeTrack = document.getElementById("track-mode-track");
  const dotStyleFilled = document.getElementById("dot-style-filled");
  const dotStyleRing = document.getElementById("dot-style-ring");
  const toggleZoom = document.getElementById("toggle-zoom");
  toggleTracks.addEventListener("change", draw);
  toggleDetections.addEventListener("change", draw);
  trackModeDot.addEventListener("change", draw);
  trackModeTrack.addEventListener("change", draw);
  dotStyleFilled.addEventListener("change", draw);
  dotStyleRing.addEventListener("change", draw);
  toggleZoom.addEventListener("change", draw);

  // Hit-zones registered during draw() so canvas clicks can map back to the
  // right episode and scroll the sidebar to it. Cleared at the start of every
  // draw. Each entry is a (axis-aligned) bounding rect in image-pixel coords
  // that covers both the dot and the callsign label.
  let hitZones = [];

  function findActiveEpisode(tid, wallMs) {
    const eps = episodesByTid.get(tid);
    if (!eps) return null;
    for (const ep of eps) {
      if (wallMs >= ep.onset - FRAME_MATCH_MS && wallMs <= ep.end + FRAME_MATCH_MS) {
        return ep;
      }
    }
    return null;
  }

  function findFrameDetection(ep, wallMs) {
    // The closest frame within FRAME_MATCH_MS, if any.
    let best = null;
    let bestDt = FRAME_MATCH_MS;
    for (const f of ep.frames) {
      const dt = Math.abs(f.t - wallMs);
      if (dt <= bestDt && f.line) {
        best = f;
        bestDt = dt;
      }
    }
    return best;
  }

  function drawTrack(track, wallMs) {
    // Backward-only: show the path the flight has already traced, not the
    // forecast. Pings at t > wallMs are suppressed so the rendered trail
    // matches what the human sees in the video at this moment.
    const inWindow = track.pings.filter(
      (p) => p.t <= wallMs && (wallMs - p.t) <= TRACK_WINDOW_MS
    );
    if (inWindow.length === 0) return;

    const active = findActiveEpisode(track.tid, wallMs);
    // Three-way dot state so the reviewer can see the exact frame the contrail
    // starts forming:
    //   - blue   : flight pass whose peak score never crosses threshold
    //   - violet : flight pass that WILL cross threshold later in this episode,
    //              but the current frame is still below threshold
    //   - yellow : current frame's raw detector score >= threshold (forming now)
    let willBeDetected = false;
    let formingNow = false;
    if (active && active.peak_score >= detectionThreshold) {
      willBeDetected = true;
      let closest = null;
      let closestDt = FRAME_MATCH_MS;
      for (const f of active.frames) {
        const dt = Math.abs(f.t - wallMs);
        if (dt < closestDt) {
          closest = f;
          closestDt = dt;
        }
      }
      if (closest && closest.score != null && closest.score >= detectionThreshold) {
        formingNow = true;
      }
    }
    const highlighted = willBeDetected;
    const color = formingNow ? "#f5c542" : (willBeDetected ? "#a855f7" : "#5aa0ff");
    const dotR = highlighted ? 9 : 6;

    // Current position: nearest ping to wallMs.
    let nearest = inWindow[0];
    let nearestDt = Math.abs(inWindow[0].t - wallMs);
    for (let i = 1; i < inWindow.length; i++) {
      const dt = Math.abs(inWindow[i].t - wallMs);
      if (dt < nearestDt) { nearest = inWindow[i]; nearestDt = dt; }
    }

    // Track line (hidden in dot-only mode).
    if (trackModeTrack.checked) {
      ctx.lineWidth = highlighted ? 4 : 2;
      ctx.strokeStyle = color;
      ctx.globalAlpha = 0.6;
      ctx.beginPath();
      ctx.moveTo(inWindow[0].x, inWindow[0].y);
      for (let i = 1; i < inWindow.length; i++) ctx.lineTo(inWindow[i].x, inWindow[i].y);
      ctx.stroke();
    }

    // Dot: filled (default) or ring (hollow, larger — so reviewers can see
    // what's inside the dot at contrail initiation).
    ctx.globalAlpha = 0.95;
    let hitR;  // radius used for click hit-testing
    if (dotStyleRing.checked) {
      const ringR = dotR + 6;
      // Thin white underlay for contrast against both dark sky and clouds.
      ctx.lineWidth = 5;
      ctx.strokeStyle = "#fff";
      ctx.beginPath();
      ctx.arc(nearest.x, nearest.y, ringR, 0, Math.PI * 2);
      ctx.stroke();
      ctx.lineWidth = 3;
      ctx.strokeStyle = color;
      ctx.beginPath();
      ctx.arc(nearest.x, nearest.y, ringR, 0, Math.PI * 2);
      ctx.stroke();
      hitR = ringR + 3;
    } else {
      ctx.beginPath();
      ctx.arc(nearest.x, nearest.y, dotR + 2, 0, Math.PI * 2);
      ctx.fillStyle = "#fff";
      ctx.fill();
      ctx.beginPath();
      ctx.arc(nearest.x, nearest.y, dotR, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
      hitR = dotR + 4;
    }

    // Callsign + flight level label with drop-shadow for readability.
    const fl = flightLevel(nearest.alt_baro_m);
    const label = fl ? (track.callsign + " " + fl) : track.callsign;
    ctx.globalAlpha = 1.0;
    ctx.font = "bold 22px system-ui, sans-serif";
    const labelX = nearest.x + hitR + 2;
    const labelY = nearest.y + 9;
    ctx.fillStyle = "#000";
    ctx.fillText(label, labelX + 1, labelY + 1);
    ctx.fillStyle = color;
    ctx.fillText(label, labelX, labelY);

    // Register a click zone covering dot+label so canvas clicks can scroll
    // the sidebar to this flight's episode row.
    const labelW = ctx.measureText(label).width;
    hitZones.push({
      episodeId: active ? active.episode_id : null,
      tid: track.tid,
      x1: nearest.x - hitR,
      y1: Math.min(nearest.y - hitR, labelY - 20),
      x2: labelX + labelW + 2,
      y2: Math.max(nearest.y + hitR, labelY + 4),
    });

    // Zoom box: floating 2.5x-zoomed magnifier of a ROI-sized region around
    // the ping, for violet/yellow flights only. One GPU blit per flight — so
    // essentially free. Placed AHEAD of the plane along its flight vector so
    // the zoom never covers the contrail trailing behind; clamps to frame
    // bounds if that would overflow.
    if (toggleZoom.checked && (formingNow || willBeDetected)) {
      const srcSize = 180;  // matches roi_along_px — same crop the detector sees
      const zoom = 2.5;
      const dstSize = srcSize * zoom;
      const sx = Math.max(0, Math.min(imgW - srcSize, nearest.x - srcSize / 2));
      const sy = Math.max(0, Math.min(imgH - srcSize, nearest.y - srcSize / 2));

      // Flight direction from the ±60s track window (oldest → nearest). Falls
      // back to +x if the track has fewer than 2 points or is stationary.
      let dirX = 1, dirY = 0;
      if (inWindow.length >= 2) {
        const back = inWindow[0];
        const vx = nearest.x - back.x;
        const vy = nearest.y - back.y;
        const norm = Math.hypot(vx, vy);
        if (norm > 1e-3) {
          dirX = vx / norm;
          dirY = vy / norm;
        }
      }
      // Pick the perpendicular offset that keeps the box away from the label
      // (which always extends to the right of the ping) — prefer negative x,
      // then positive y. Score = -perp.x + 0.5 * perp.y; higher is better.
      const perpA = { x: -dirY, y: dirX };
      const perpB = { x: dirY, y: -dirX };
      const perp = (-perpA.x + 0.5 * perpA.y >= -perpB.x + 0.5 * perpB.y)
        ? perpA : perpB;

      // Place box diagonally offset: forward along the flight vector AND
      // sideways along the chosen perpendicular. The near corner of the box
      // is a small gap diagonally off the ping, so the leader line lands on
      // a corner (not an edge) and the box never sits on the flight path.
      const gap = 26;
      const centerX = nearest.x + dirX * (dstSize / 2 + gap) + perp.x * (dstSize / 2 + gap);
      const centerY = nearest.y + dirY * (dstSize / 2 + gap) + perp.y * (dstSize / 2 + gap);
      let dx = Math.max(0, Math.min(imgW - dstSize, centerX - dstSize / 2));
      let dy = Math.max(0, Math.min(imgH - dstSize, centerY - dstSize / 2));

      ctx.globalAlpha = 1.0;
      try {
        ctx.drawImage(video, sx, sy, srcSize, srcSize, dx, dy, dstSize, dstSize);
      } catch (_) {
        // First frame may not be decoded yet — skip silently.
      }
      ctx.lineWidth = 3;
      ctx.strokeStyle = color;
      ctx.strokeRect(dx, dy, dstSize, dstSize);

      // Dot inside the zoom box marking the plane's exact position. The crop
      // src origin is (sx, sy); the ping maps to (dx + (nearest.x-sx)*zoom, ...).
      const zPingX = dx + (nearest.x - sx) * zoom;
      const zPingY = dy + (nearest.y - sy) * zoom;
      ctx.globalAlpha = 1.0;
      ctx.beginPath();
      ctx.arc(zPingX, zPingY, 7, 0, Math.PI * 2);
      ctx.fillStyle = "#fff";
      ctx.fill();
      ctx.beginPath();
      ctx.arc(zPingX, zPingY, 5, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();

      // Leader line: ping → nearest corner of the zoom box. Always a corner
      // (not a clamped edge) so the box is visibly offset from the flight path.
      const cornerX = (nearest.x < dx + dstSize / 2) ? dx : dx + dstSize;
      const cornerY = (nearest.y < dy + dstSize / 2) ? dy : dy + dstSize;
      ctx.lineWidth = 2;
      ctx.globalAlpha = 0.7;
      ctx.beginPath();
      ctx.moveTo(nearest.x, nearest.y);
      ctx.lineTo(cornerX, cornerY);
      ctx.stroke();
      ctx.globalAlpha = 1.0;

      // Clicking the zoom box also jumps to the episode.
      hitZones.push({
        episodeId: active ? active.episode_id : null,
        tid: track.tid,
        x1: dx, y1: dy, x2: dx + dstSize, y2: dy + dstSize,
      });
    }
  }

  function drawDetections(wallMs) {
    ctx.strokeStyle = "#ff3b3b";
    ctx.lineWidth = 5;
    ctx.globalAlpha = 0.95;
    for (const [tid, eps] of episodesByTid.entries()) {
      for (const ep of eps) {
        if (wallMs < ep.onset - FRAME_MATCH_MS || wallMs > ep.end + FRAME_MATCH_MS) {
          continue;
        }
        const frame = findFrameDetection(ep, wallMs);
        if (!frame) continue;
        const [x1, y1, x2, y2] = frame.line;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      }
    }
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    hitZones = [];
    const wallMs = currentWallMs(video.currentTime);
    if (toggleTracks.checked) {
      ctx.globalAlpha = 0.85;
      for (const track of flightTracks) drawTrack(track, wallMs);
    }
    if (toggleDetections.checked) {
      drawDetections(wallMs);
    }
    ctx.globalAlpha = 1.0;
  }

  // Click-to-scroll: clicking on a ping or callsign label in the video jumps
  // the sidebar to the matching episode row and flashes it. If the row is
  // hidden by the "detected only" filter, uncheck the filter so the click
  // still surfaces something.
  function scrollToEpisode(episodeId) {
    if (episodeId == null) return;
    let dom = episodeDom.get(String(episodeId));
    if (!dom && filterDetectedEl.checked) {
      filterDetectedEl.checked = false;
      renderEpisodeList();
      dom = episodeDom.get(String(episodeId));
    }
    if (!dom) return;
    dom.wrapper.scrollIntoView({ behavior: "smooth", block: "center" });
    dom.wrapper.classList.remove("flash");
    // Re-add on next frame so the animation replays on repeated clicks.
    requestAnimationFrame(() => dom.wrapper.classList.add("flash"));
  }

  const videoWrap = document.getElementById("video-wrap");
  videoWrap.addEventListener("click", (e) => {
    const rect = video.getBoundingClientRect();
    const sx = imgW / rect.width;
    const sy = imgH / rect.height;
    const ix = (e.clientX - rect.left) * sx;
    const iy = (e.clientY - rect.top) * sy;
    for (let i = hitZones.length - 1; i >= 0; i--) {
      const z = hitZones[i];
      if (ix >= z.x1 && ix <= z.x2 && iy >= z.y1 && iy <= z.y2) {
        scrollToEpisode(z.episodeId);
        e.preventDefault();
        e.stopPropagation();
        break;
      }
    }
  });
  // Show pointer cursor when hovering over a registered hit zone so reviewers
  // discover the affordance.
  videoWrap.addEventListener("mousemove", (e) => {
    const rect = video.getBoundingClientRect();
    const sx = imgW / rect.width;
    const sy = imgH / rect.height;
    const ix = (e.clientX - rect.left) * sx;
    const iy = (e.clientY - rect.top) * sy;
    let over = false;
    for (const z of hitZones) {
      if (ix >= z.x1 && ix <= z.x2 && iy >= z.y1 && iy <= z.y2) {
        over = true;
        break;
      }
    }
    videoWrap.classList.toggle("clickable", over);
  });

  // Sync overlay to every presented video frame. "timeupdate" only fires at
  // ~4 Hz regardless of playback fps, so at 30 fps playback the ping would
  // otherwise drift 5-7 frames behind the video. requestVideoFrameCallback
  // fires exactly once per painted video frame (Chrome/Edge/Safari/FF); we
  // fall back to rAF when unavailable.
  const hasRVFC = typeof video.requestVideoFrameCallback === "function";
  function tick() {
    draw();
    if (video.paused || video.ended) return;
    if (hasRVFC) video.requestVideoFrameCallback(tick);
    else requestAnimationFrame(tick);
  }
  video.addEventListener("play", () => {
    if (hasRVFC) video.requestVideoFrameCallback(tick);
    else requestAnimationFrame(tick);
  });
  // Still redraw on scrub/pause/seek when no frames are being presented.
  video.addEventListener("seeked", draw);
  video.addEventListener("pause", draw);
  video.addEventListener("loadeddata", () => {
    fitCanvas();
    draw();
  });

  // --- Video source ------------------------------------------------------
  video.src = manifest.video.path;
  video.addEventListener("error", () => {
    showError("Video failed to load: " + manifest.video.path);
  });

  // --- Labels: localStorage persistence + export -------------------------
  // Keyed by (date, labeler_id) so multiple bundles on the same machine don't
  // collide. Values are keyed by episode_id (string) with partial state
  // allowed (e.g. notes without a label) so students don't lose typing if
  // they reload mid-work.
  const STORAGE_KEY =
    "concam-labels:" + manifest.date + ":" + manifest.labeler_id;
  const VALID_LABELS = ["contrail", "no_contrail", "unsure"];

  function loadLabels() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return {};
      const parsed = JSON.parse(raw);
      return parsed && typeof parsed === "object" ? parsed : {};
    } catch (e) {
      console.warn("Failed to parse saved labels:", e);
      return {};
    }
  }

  function saveLabels() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(labelState));
    } catch (e) {
      showError("Failed to save to localStorage: " + e.message);
    }
  }

  const labelState = loadLabels();

  function getLabelEntry(episodeId) {
    const key = String(episodeId);
    if (!labelState[key]) labelState[key] = {};
    return labelState[key];
  }

  function updateLabel(episodeId, patch) {
    const entry = getLabelEntry(episodeId);
    Object.assign(entry, patch);
    // Touch timestamp only when a meaningful change happens — we always
    // update because any edit is a signal the labeler was active at that
    // moment, which is the audit data we want to preserve.
    entry.label_timestamp = new Date().toISOString();
    saveLabels();
    refreshEpisodeDom(episodeId);
    updateProgress();
    renderHeatmap();
  }

  function labelsForExport() {
    // Only episodes with a chosen label are exported. Notes-only or
    // rating-only entries are preserved in localStorage but not ingested.
    const out = [];
    for (const ep of manifest.episodes) {
      const entry = labelState[String(ep.episode_id)];
      if (!entry || !VALID_LABELS.includes(entry.label)) continue;
      const record = {
        episode_id: ep.episode_id,
        label: entry.label,
        labeler_id: manifest.labeler_id,
      };
      if (typeof entry.persistence_rating === "number") {
        record.persistence_rating = entry.persistence_rating;
      }
      if (entry.label_timestamp) {
        record.label_timestamp = entry.label_timestamp;
      }
      const notes = (entry.label_notes || "").trim();
      if (notes) record.label_notes = notes;
      out.push(record);
    }
    return out;
  }

  function exportLabels() {
    const payload = {
      schema_version: 1,
      date: manifest.date,
      labeler_id: manifest.labeler_id,
      exported_at: new Date().toISOString(),
      labels: labelsForExport(),
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], {
      type: "application/json",
    });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = manifest.date + "_" + manifest.labeler_id + "_labels.json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  document.getElementById("export-btn").addEventListener("click", exportLabels);

  // --- Heatmap: time × flight level --------------------------------------
  // Bins each episode (one flight pass) into a (10-min, 10-FL) cell. Color:
  //   red   = at least one contrail observation (auto >= threshold OR human
  //           label = "contrail") in that cell, no clear obs;
  //   blue  = at least one clear observation, no contrail obs;
  //   grey  = both contrail and clear obs in the same cell (disagreement);
  //   black = no flight passed through that cell.
  // Human labels override auto-detection; "unsure" excludes the episode.
  // The bin spec is exposed on `window.heatmapSpec` so the post-hoc Python
  // regenerator can reproduce the exact same rendering from manifest+labels.
  const HEATMAP_FL_MIN = 250;
  const HEATMAP_FL_MAX = 450;
  const HEATMAP_FL_STEP = 10;
  const HEATMAP_BIN_MIN = 10;
  window.heatmapSpec = {
    fl_min: HEATMAP_FL_MIN,
    fl_max: HEATMAP_FL_MAX,
    fl_step: HEATMAP_FL_STEP,
    bin_minutes: HEATMAP_BIN_MIN,
  };

  function metresToFL(altMetres) {
    if (altMetres == null || !isFinite(altMetres)) return null;
    return (altMetres * 3.28084) / 100;
  }

  function episodeMedianFL(ep) {
    const track = (manifest.flight_tracks || {})[ep.transponder_id];
    if (!track) return null;
    const onset = Date.parse(ep.onset);
    const end = Date.parse(ep.end);
    const fls = [];
    for (const p of track.pings) {
      const t = Date.parse(p.wall_time_utc);
      if (t < onset || t > end) continue;
      const alt = p.alt_baro_m != null ? p.alt_baro_m : p.alt_m;
      const fl = metresToFL(alt);
      if (fl != null) fls.push(fl);
    }
    if (fls.length === 0) return null;
    fls.sort((a, b) => a - b);
    return fls[Math.floor(fls.length / 2)];
  }

  function classifyEpisode(ep) {
    // Human label wins. Returns "contrail", "clear", or null (excluded).
    const entry = labelState[String(ep.episode_id)];
    if (entry && VALID_LABELS.includes(entry.label)) {
      if (entry.label === "contrail") return "contrail";
      if (entry.label === "no_contrail") return "clear";
      return null;  // unsure
    }
    return ep.peak_score >= detectionThreshold ? "contrail" : "clear";
  }

  function computeHeatmap() {
    const dayStartMs = Date.parse(manifest.date + "T00:00:00Z");
    const binMs = HEATMAP_BIN_MIN * 60_000;
    const nRows = (HEATMAP_FL_MAX - HEATMAP_FL_MIN) / HEATMAP_FL_STEP;

    const observations = [];
    for (const ep of manifest.episodes) {
      const fl = episodeMedianFL(ep);
      if (fl == null) continue;
      const cls = classifyEpisode(ep);
      if (!cls) continue;
      const tMid = (Date.parse(ep.onset) + Date.parse(ep.end)) / 2;
      observations.push({ ep, tMid, fl, cls });
    }

    // X range: snap to bin boundaries around the activity window with one bin
    // padding on each side; fall back to whole day if no observations.
    let xMinMs, xMaxMs;
    if (observations.length === 0) {
      xMinMs = dayStartMs;
      xMaxMs = dayStartMs + 86_400_000;
    } else {
      const tMin = Math.min(...observations.map((o) => o.tMid));
      const tMax = Math.max(...observations.map((o) => o.tMid));
      xMinMs = dayStartMs + Math.floor((tMin - dayStartMs) / binMs) * binMs - binMs;
      xMaxMs = dayStartMs + Math.ceil((tMax - dayStartMs) / binMs) * binMs + binMs;
    }
    const nBins = Math.max(1, Math.round((xMaxMs - xMinMs) / binMs));

    // cells[bin][row] = { contrail: [...], clear: [...] }
    const cells = [];
    for (let b = 0; b < nBins; b++) {
      const col = [];
      for (let r = 0; r < nRows; r++) col.push({ contrail: [], clear: [] });
      cells.push(col);
    }
    for (const o of observations) {
      const bin = Math.floor((o.tMid - xMinMs) / binMs);
      if (bin < 0 || bin >= nBins) continue;
      if (o.fl < HEATMAP_FL_MIN || o.fl >= HEATMAP_FL_MAX) continue;
      const row = Math.floor((o.fl - HEATMAP_FL_MIN) / HEATMAP_FL_STEP);
      cells[bin][row][o.cls].push({
        callsign: o.ep.callsign,
        episode_id: o.ep.episode_id,
        score: o.ep.peak_score,
        fl: o.fl,
        label: (labelState[String(o.ep.episode_id)] || {}).label || null,
      });
    }
    return { cells, nBins, nRows, xMinMs, xMaxMs, binMs };
  }

  function cellColor(c, k) {
    // c = contrail count, k = clear count. Saturates at 4 for visual.
    if (c === 0 && k === 0) return "#1a1a1a";
    if (c > 0 && k > 0) return "#888888";
    if (c > 0) {
      const a = 0.4 + 0.15 * Math.min(c, 4);
      return `rgba(239, 68, 68, ${a.toFixed(2)})`;
    }
    const a = 0.35 + 0.15 * Math.min(k, 4);
    return `rgba(59, 130, 246, ${a.toFixed(2)})`;
  }

  const heatmapPanel = document.getElementById("heatmap-panel");
  const heatmapSvg = document.getElementById("heatmap-svg");
  const heatmapTooltip = document.getElementById("heatmap-tooltip");
  const SVG_NS = "http://www.w3.org/2000/svg";

  function fmtCellTime(ms) {
    return new Date(ms).toISOString().substring(11, 16);
  }

  function showTooltip(evt, bin, row, cell, xMinMs, binMs) {
    const tStart = xMinMs + bin * binMs;
    const tEnd = tStart + binMs;
    const flLo = HEATMAP_FL_MIN + row * HEATMAP_FL_STEP;
    const flHi = flLo + HEATMAP_FL_STEP;
    const all = [
      ...cell.contrail.map((f) => ({ ...f, _cls: "contrail" })),
      ...cell.clear.map((f) => ({ ...f, _cls: "clear" })),
    ];
    if (all.length === 0) {
      heatmapTooltip.innerHTML =
        `<strong>${fmtCellTime(tStart)}–${fmtCellTime(tEnd)}Z` +
        ` &middot; FL${flLo}–FL${flHi}</strong><br>no flights`;
    } else {
      const rows = all
        .sort((a, b) => (a._cls === "contrail" ? -1 : 1))
        .map((f) => {
          const labelTag = f.label ? ` (${f.label.replace("_", " ")})` : "";
          return `<div class="hm-flight ${f._cls}">${f.callsign}` +
            ` &middot; FL${Math.round(f.fl)}` +
            ` &middot; score ${f.score.toFixed(2)}${labelTag}</div>`;
        })
        .join("");
      heatmapTooltip.innerHTML =
        `<strong>${fmtCellTime(tStart)}–${fmtCellTime(tEnd)}Z` +
        ` &middot; FL${flLo}–FL${flHi}</strong>${rows}`;
    }
    heatmapTooltip.style.display = "block";
    moveTooltip(evt);
  }

  function moveTooltip(evt) {
    const panelRect = heatmapPanel.getBoundingClientRect();
    const tipRect = heatmapTooltip.getBoundingClientRect();
    let x = evt.clientX - panelRect.left + 12;
    let y = evt.clientY - panelRect.top + 12;
    // Clamp inside the panel so the tooltip never escapes the sidebar.
    if (x + tipRect.width > panelRect.width - 4) {
      x = evt.clientX - panelRect.left - tipRect.width - 12;
    }
    if (y + tipRect.height > panelRect.height - 4) {
      y = panelRect.height - tipRect.height - 4;
    }
    heatmapTooltip.style.left = x + "px";
    heatmapTooltip.style.top = y + "px";
  }

  function hideTooltip() {
    heatmapTooltip.style.display = "none";
  }

  function renderHeatmap() {
    const data = computeHeatmap();
    const { cells, nBins, nRows, xMinMs, xMaxMs, binMs } = data;
    if (nBins === 0) {
      heatmapPanel.hidden = true;
      return;
    }
    heatmapPanel.hidden = false;

    // Layout: cell width auto-fits the available width with a 2px floor so a
    // full 24h × 10-min span (~144 bins) fits inside a 420px sidebar without
    // horizontal scroll. The panel falls back to overflow-x:auto otherwise.
    const marginL = 36, marginR = 8, marginT = 8, marginB = 22;
    const availW = Math.max(200, heatmapPanel.clientWidth - marginL - marginR - 16);
    const cellW = Math.max(2, Math.floor(availW / nBins));
    const cellH = 8;
    const plotW = cellW * nBins;
    const plotH = cellH * nRows;
    const svgW = plotW + marginL + marginR;
    const svgH = plotH + marginT + marginB;

    while (heatmapSvg.firstChild) heatmapSvg.removeChild(heatmapSvg.firstChild);
    heatmapSvg.setAttribute("viewBox", `0 0 ${svgW} ${svgH}`);
    heatmapSvg.setAttribute("width", svgW);
    heatmapSvg.setAttribute("height", svgH);

    // Plot frame.
    const frame = document.createElementNS(SVG_NS, "rect");
    frame.setAttribute("class", "hm-frame");
    frame.setAttribute("x", marginL);
    frame.setAttribute("y", marginT);
    frame.setAttribute("width", plotW);
    frame.setAttribute("height", plotH);
    heatmapSvg.appendChild(frame);

    // Cells. y axis is inverted (FL450 at top, FL250 at bottom) to match the
    // mental model of altitude in atmospheric plots.
    for (let b = 0; b < nBins; b++) {
      for (let r = 0; r < nRows; r++) {
        const cell = cells[b][r];
        const c = cell.contrail.length;
        const k = cell.clear.length;
        const rect = document.createElementNS(SVG_NS, "rect");
        rect.setAttribute("class", "hm-cell");
        rect.setAttribute("x", marginL + b * cellW);
        rect.setAttribute("y", marginT + (nRows - 1 - r) * cellH);
        rect.setAttribute("width", cellW);
        rect.setAttribute("height", cellH);
        rect.setAttribute("fill", cellColor(c, k));
        rect.addEventListener("mouseenter", (e) =>
          showTooltip(e, b, r, cell, xMinMs, binMs));
        rect.addEventListener("mousemove", moveTooltip);
        rect.addEventListener("mouseleave", hideTooltip);
        heatmapSvg.appendChild(rect);
      }
    }

    // Y-axis: FL labels every 50 (5 rows). Label position = top of that row.
    for (let fl = HEATMAP_FL_MIN; fl <= HEATMAP_FL_MAX; fl += 50) {
      const rowFromBottom = (fl - HEATMAP_FL_MIN) / HEATMAP_FL_STEP;
      const yPx = marginT + (nRows - rowFromBottom) * cellH;
      const txt = document.createElementNS(SVG_NS, "text");
      txt.setAttribute("class", "hm-axis");
      txt.setAttribute("x", marginL - 4);
      txt.setAttribute("y", yPx + 3);
      txt.setAttribute("text-anchor", "end");
      txt.textContent = "FL" + fl;
      heatmapSvg.appendChild(txt);
    }

    // X-axis: HH:MM labels. Choose cadence so labels don't overlap — each
    // "HH:MM" needs ~28px at 9px font, so we space at least that far apart.
    const hourMs = 3_600_000;
    const minPxBetweenLabels = 30;
    const pxPerHour = cellW * 6;
    const labelEveryHours = pxPerHour >= minPxBetweenLabels ? 1
      : pxPerHour * 2 >= minPxBetweenLabels ? 2
      : pxPerHour * 4 >= minPxBetweenLabels ? 4
      : 6;
    const dayStartMs = Date.parse(manifest.date + "T00:00:00Z");
    const firstHour = Math.ceil((xMinMs - dayStartMs) / hourMs);
    const lastHour = Math.floor((xMaxMs - dayStartMs) / hourMs);
    for (let h = firstHour; h <= lastHour; h++) {
      if (h % labelEveryHours !== 0) continue;
      const tMs = dayStartMs + h * hourMs;
      const xPx = marginL + ((tMs - xMinMs) / binMs) * cellW;
      const tick = document.createElementNS(SVG_NS, "line");
      tick.setAttribute("class", "hm-frame");
      tick.setAttribute("x1", xPx);
      tick.setAttribute("y1", marginT + plotH);
      tick.setAttribute("x2", xPx);
      tick.setAttribute("y2", marginT + plotH + 3);
      heatmapSvg.appendChild(tick);
      const txt = document.createElementNS(SVG_NS, "text");
      txt.setAttribute("class", "hm-axis");
      txt.setAttribute("x", xPx);
      txt.setAttribute("y", marginT + plotH + 12);
      txt.setAttribute("text-anchor", "middle");
      txt.textContent = String(h % 24).padStart(2, "0") + ":00";
      heatmapSvg.appendChild(txt);
    }
  }

  // --- Heatmap exports ---------------------------------------------------
  function serializeHeatmapSvg() {
    // Inline the panel's CSS so the standalone file renders identically.
    // We grab only the rules that target #heatmap-svg or .hm-* classes.
    const rules = [
      ".hm-axis { font: 9px system-ui, sans-serif; fill: #666; }",
      ".hm-frame { fill: none; stroke: #bbb; stroke-width: 0.5; }",
    ].join("\n");
    const clone = heatmapSvg.cloneNode(true);
    clone.setAttribute("xmlns", SVG_NS);
    const style = document.createElementNS(SVG_NS, "style");
    style.textContent = rules;
    clone.insertBefore(style, clone.firstChild);
    return new XMLSerializer().serializeToString(clone);
  }

  function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function downloadHeatmapSvg() {
    const xml = serializeHeatmapSvg();
    const blob = new Blob([xml], { type: "image/svg+xml" });
    downloadBlob(blob, manifest.date + "_" + manifest.labeler_id + "_heatmap.svg");
  }

  function downloadHeatmapPng() {
    // 2x rasterisation for crisp screenshots without bloating the SVG itself.
    const xml = serializeHeatmapSvg();
    const w = parseFloat(heatmapSvg.getAttribute("width"));
    const h = parseFloat(heatmapSvg.getAttribute("height"));
    const scale = 2;
    const blob = new Blob([xml], { type: "image/svg+xml;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement("canvas");
      canvas.width = w * scale;
      canvas.height = h * scale;
      const cctx = canvas.getContext("2d");
      cctx.fillStyle = "#fafafa";
      cctx.fillRect(0, 0, canvas.width, canvas.height);
      cctx.scale(scale, scale);
      cctx.drawImage(img, 0, 0);
      URL.revokeObjectURL(url);
      canvas.toBlob((png) => {
        if (png) downloadBlob(png,
          manifest.date + "_" + manifest.labeler_id + "_heatmap.png");
      }, "image/png");
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      showError("PNG export failed: SVG could not be rasterised.");
    };
    img.src = url;
  }

  document.getElementById("heatmap-svg-btn")
    .addEventListener("click", downloadHeatmapSvg);
  document.getElementById("heatmap-png-btn")
    .addEventListener("click", downloadHeatmapPng);
  window.addEventListener("resize", () => { renderHeatmap(); });

  // --- Episode panel -----------------------------------------------------
  const panel = document.getElementById("episodes");
  panel.innerHTML = "";
  const episodeDom = new Map();

  function formatLabelStatus(entry) {
    if (!entry || !entry.label) return "unlabeled";
    return entry.label;
  }

  function refreshEpisodeDom(episodeId) {
    const dom = episodeDom.get(String(episodeId));
    if (!dom) return;
    const entry = labelState[String(episodeId)] || {};
    dom.wrapper.classList.toggle("labeled", VALID_LABELS.includes(entry.label));
    const cls = VALID_LABELS.includes(entry.label) ? entry.label : "";
    dom.statusBadge.className = "badge label-status " + cls;
    dom.statusBadge.textContent = formatLabelStatus(entry);
  }

  function updateProgress() {
    const total = manifest.episodes.length;
    let done = 0;
    let contrails = 0;
    for (const ep of manifest.episodes) {
      const entry = labelState[String(ep.episode_id)];
      if (!entry || !VALID_LABELS.includes(entry.label)) continue;
      done += 1;
      if (entry.label === "contrail") contrails += 1;
    }
    document.getElementById("progress").textContent =
      "labeled " + done + "/" + total;
    const scoreEl = document.getElementById("hdr-score");
    scoreEl.textContent = contrails + " contrail" + (contrails === 1 ? "" : "s") + " found";
  }

  function buildEpisodeRow(ep) {
    const wrapper = document.createElement("div");
    wrapper.className = "episode";
    wrapper.dataset.episodeId = ep.episode_id;

    const header = document.createElement("div");
    header.className = "episode-header";
    const overlapBadge = ep.is_overlap
      ? '<span class="badge overlap">overlap</span> '
      : "";
    const detectedBadge =
      ep.peak_score >= detectionThreshold
        ? '<span class="badge detected">auto</span> '
        : "";
    const timeTooltip = ep.onset + " → " + ep.end + " (UTC)";
    const timesHtml =
      '<span class="ep-times" title="' + timeTooltip + '">' +
        fmtTimeUTC(ep.onset) + '–' + fmtTimeUTC(ep.end) + 'Z' +
        ' <span class="ep-time-local">(' +
          fmtTimeLocal(ep.onset) + '–' + fmtTimeLocal(ep.end) +
          ' ' + localTzAbbr +
        ')</span>' +
      '</span>';
    header.innerHTML =
      overlapBadge +
      detectedBadge +
      '<strong>#' + ep.episode_id + '</strong> ' +
      ep.callsign + ' ' +
      '<span class="badge score">score ' + ep.peak_score.toFixed(2) + '</span> ' +
      timesHtml + ' ' +
      '<span class="badge label-status">unlabeled</span>';
    const statusBadge = header.querySelector(".badge.label-status");

    header.addEventListener("click", (evt) => {
      // Ignore clicks that originate on a control inside the row.
      if (evt.target.closest(".label-controls")) return;
      const sec = wallMsToVideoTime(Date.parse(ep.onset));
      if (isFinite(sec) && sec >= 0) {
        video.currentTime = sec;
        video.play().catch(() => {});
      }
    });

    const controls = document.createElement("div");
    controls.className = "label-controls";

    // Three-way label group.
    const labelGroup = document.createElement("span");
    labelGroup.className = "group";
    labelGroup.dataset.role = "label-group";
    const groupName = "lbl-" + ep.episode_id;
    VALID_LABELS.forEach((val) => {
      const id = groupName + "-" + val;
      labelGroup.insertAdjacentHTML(
        "beforeend",
        '<input type="radio" name="' + groupName + '" id="' + id +
          '" value="' + val + '" data-role="label-radio">' +
          '<label for="' + id + '">' + val.replace("_", " ") + '</label>'
      );
    });
    controls.appendChild(labelGroup);

    // Persistence slider 1-5.
    const rating = document.createElement("span");
    rating.className = "group";
    rating.innerHTML =
      '<label>persistence ' +
      '<input type="range" min="1" max="5" step="1" data-role="rating">' +
      ' <output data-role="rating-output">—</output></label>';
    controls.appendChild(rating);

    // Free-text notes.
    const notes = document.createElement("textarea");
    notes.placeholder = "notes (optional)";
    notes.dataset.role = "notes";
    controls.appendChild(notes);

    wrapper.appendChild(header);
    wrapper.appendChild(controls);

    // Restore saved state into controls.
    const entry = labelState[String(ep.episode_id)] || {};
    if (VALID_LABELS.includes(entry.label)) {
      const r = labelGroup.querySelector('input[value="' + entry.label + '"]');
      if (r) r.checked = true;
    }
    const ratingInput = rating.querySelector('[data-role="rating"]');
    const ratingOutput = rating.querySelector('[data-role="rating-output"]');
    if (typeof entry.persistence_rating === "number") {
      ratingInput.value = String(entry.persistence_rating);
      ratingOutput.textContent = String(entry.persistence_rating);
    } else {
      // Range inputs default mid-range; show an em dash until user interacts.
      ratingInput.value = "3";
    }
    notes.value = entry.label_notes || "";

    // Wire change handlers — every edit autosaves.
    labelGroup.querySelectorAll('input[data-role="label-radio"]').forEach((r) => {
      r.addEventListener("change", () => {
        if (r.checked) updateLabel(ep.episode_id, { label: r.value });
      });
    });
    ratingInput.addEventListener("input", () => {
      ratingOutput.textContent = ratingInput.value;
      updateLabel(ep.episode_id, {
        persistence_rating: parseInt(ratingInput.value, 10),
      });
    });
    notes.addEventListener("input", () => {
      updateLabel(ep.episode_id, { label_notes: notes.value });
    });

    episodeDom.set(String(ep.episode_id), { wrapper, statusBadge });
    return wrapper;
  }

  const sortModeEl = document.getElementById("sort-mode");
  const filterDetectedEl = document.getElementById("filter-detected");

  function renderEpisodeList() {
    panel.innerHTML = "";
    episodeDom.clear();
    const mode = sortModeEl.value;
    const onlyDetected = filterDetectedEl.checked;
    let list = manifest.episodes.slice();
    if (onlyDetected) {
      list = list.filter((ep) => ep.peak_score >= detectionThreshold);
    }
    if (mode === "score") {
      list.sort((a, b) => b.peak_score - a.peak_score ||
                         (a.onset < b.onset ? -1 : 1));
    } else {
      list.sort((a, b) => (a.onset < b.onset ? -1 : a.onset > b.onset ? 1 : 0));
    }
    for (const ep of list) panel.appendChild(buildEpisodeRow(ep));
    for (const ep of list) refreshEpisodeDom(ep.episode_id);
  }

  sortModeEl.addEventListener("change", renderEpisodeList);
  filterDetectedEl.addEventListener("change", renderEpisodeList);
  renderEpisodeList();
  updateProgress();
  renderHeatmap();
})();
</script>

</body>
</html>

# Site configuration: MIT Green Building sky camera (concam pipeline)
# Camera is a 4K fisheye mounted on the roof of MIT Building 54 (Green Building).
# All coordinates and calibration values come from LAE_skycam/calibration/.

name: mit_green_building
timezone: America/New_York

# Camera GPS position (WGS84): latitude, longitude, altitude (m above ellipsoid)
# Source: pointpicker_calibration_estimate.npz -> camera_gps field
camera_lat: 42.360444
camera_lon: -71.089238
camera_alt_m: 84.226575

# --- Video ---
video:
  root: /net/d16/data/contrail-camera
  # Daily timelapse: 30fps playback, 1 frame/real-second, AV1 codec
  timelapse_glob: "{date:%Y_%m_%d}_0000_2359.mp4"
  # Raw hourly segments: 4fps, H.265 codec
  raw_segment_glob: "raw_segments_clean/{date:%Y-%m-%d}_*.mp4"

# --- Timestamp OCR ---
# The timestamp is burned into the top-right corner of every frame.
# Region dimensions confirmed by probing real frames.
ocr:
  timestamp_position: top_right
  # (height, width) of the timestamp crop region in pixels at native 3840x2160
  timestamp_region: [80, 875]
  # EasyOCR fallback is triggered when per-character confidence drops below this
  fallback_confidence_threshold: 0.6

# --- ADS-B ---
adsb:
  data_dir: /home/mcast/data/feder
  # Only include flights above this altitude (cruising altitude filter)
  min_altitude_m: 8000.0
  # Horizontal radius around the camera site; pings outside this are discarded
  max_radius_km: 50.0
  site_lat: 42.360444
  site_lon: -71.089238
  # Altitude source policy for projection:
  #   auto: prefer GNSS when consistent with barometric; fall back to baro+geoid
  #     when GNSS is missing or disagrees by more than altitude_discrepancy_threshold_m
  #   gnss: always use GNSS (WGS-84 HAE)
  #   barometric: always use barometric (ISA) + geoid offset
  altitude_source: auto
  # Baro/GNSS disagreement above this (meters) triggers the baro fallback.
  # ~400 ft / 122 m is the surveillance-literature red-flag threshold.
  altitude_discrepancy_threshold_m: 122.0
  # EGM96 geoid height relative to the WGS-84 ellipsoid at the site.
  # Boston, MA: approximately -28 m. Applied as: h_ellipsoid = h_msl + offset
  site_geoid_offset_m: -28.0

# --- Camera calibration ---
calibration:
  # pointpicker_calibration_estimate.npz has the best GPS-anchored extrinsics
  npz_path: /home/prash/contrails/LAE_skycam/calibration/pointpicker_calibration_estimate.npz
  # Resolution at which the calibration was performed
  calibration_resolution: [3840, 2160]

# --- Detection (rotated-ROI + angle-constrained Hough) ---
# Parameters tuned on the April 8, 2026 labeled set (7 positives / 13 negatives)
# via the ROI dimension sub-grid sweep (PRD item 20) + cross_grad preprocessing
# sweep (PRD item 19). Best combo: roi_along=180, roi_cross=40, cross_grad,
# AUC=0.973 / Youden-J=0.923 on Apr-8. Cross-date note: Apr-9 labels (12 pos /
# 13 neg) favor wider cross-track (120×80) for complex backgrounds; the 180×40
# setting may need per-date retuning once more labeled dates are available.
# Source: output/validation/detection/2026-04-08/roi_dimension_sweep_report.md
#         output/validation/detection/2026-04-08/sweep_report_cross_grad.md
detection:
  score_threshold: 0.3
  # Legacy / fallback Canny thresholds (used when use_adaptive_canny=false)
  canny_low: 50
  canny_high: 150
  hough_threshold: 15
  hough_min_line_length: 20
  # Larger gap allows fragmented contrail segments to connect; best Apr-8 combo.
  hough_max_line_gap: 10
  # Legacy ROI knob preserved for back-compat; the explicit along/cross below win.
  roi_padding: 20
  # Rotated rectangle dimensions for the detection ROI.
  # 180×40 won the ROI dimension sub-grid sweep on Apr-8 (AUC 0.912→0.973).
  # Wider along-track captures more of the contrail streak without adding noise.
  roi_along_px: 180
  roi_cross_px: 40
  # Adaptive Canny thresholds derived from percentiles of the masked ROI pixels.
  use_adaptive_canny: true
  canny_percentile_low: 96.0
  # Higher percentile keeps only the very brightest edges (contrail core).
  canny_percentile_high: 99.8
  canny_low_ratio: 0.25
  canny_min_high: 60
  # Hough lines must align with the flight-path vector within this tolerance.
  angle_tolerance_deg: 12.0
  # Longer minimum prevents short noise edges from counting; best Apr-8 combo.
  long_line_min_px: 25.0
  # Count of aligned long lines that maps to score=1.0.
  score_norm_count: 6
  # When true, Canny / Hough only see pixels inside the rotated polygon.
  use_rotated_mask: true
  # Gaussian blur kernel applied before Canny (set to 0 to disable).
  blur_kernel: 3
  # Cross-gradient preprocessing: compute Sobel gradient perpendicular to the
  # flight-path vector before Canny. Suppresses along-track cloud edges while
  # preserving cross-track contrail edges. Validated on Apr-8 (AUC 1.000→0.912
  # vs none=1.000; better generalisation) and Apr-9 (cross_grad best: 0.769).
  preprocessing: cross_grad
  # Burned-in OSD timestamp region to exclude from Canny/Hough.
  # The clock/date overlay occupies the top-right corner of every frame
  # (height=80 px, width=875 px at 3840x2160).  Adding a 15 px safety pad on
  # all sides that are not frame edges.
  # Format: [y0, y1, x0, x1] — numpy-style row/col slice in full-frame pixels.
  # y0=0 (top edge), y1=95 (80+15 pad), x0=2950 (3840-875-15), x1=3840
  timestamp_exclusion_region: [0, 95, 2950, 3840]
  # Adaptive contrail length measurement: grow the along-track ROI by
  # growth_step_px (each direction) until the aligned-long-line count stops
  # increasing or the total along-track dimension hits roi_max_along_px.
  # At ~10 km altitude and 4K resolution, 600 px ≈ 9 km of contrail extent.
  growth_step_px: 20
  roi_max_along_px: 600

# --- Episode aggregation ---
aggregation:
  # Matches the Youden-J threshold from the April 8 sweep (one aligned long
  # line → score 0.167; threshold 0.083 accepts that as a hit).
  detection_threshold: 0.083
  # Consecutive frames within this gap are merged into a single episode
  max_gap_seconds: 30.0
